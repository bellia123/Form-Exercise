<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample form</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <form action="">
        <!-- heading -->
        <h1>Login Form</h1>
        <!-- main form wrapper -->
        <div class="login-setup">
            <!-- mobile/email input -->
             <div class="input-group">
            <input type="text" placeholder="Mobile/Email" required>
            <span class="icon"><i class="fa-solid fa-user"></i></span>
            </div>

<div class="input-group">
            <input type="password" placeholder="password" required>
            <span class="icon"><i class="fa-solid fa-lock"></i></span>
</div>

            <a href="#">Forgot password?</a>


            <button type="submit"><i class="bi bi-login">login</i></button>

        </div>
        <!-- other login option -->
        <div class="other-login">
            <p>Or login with</p>
            <div class="social-button">
                <button class="facebook-button" type="button">facebook</button>
                <button class="insta-button" type="button">instagram</button>
            </div>
        </div>
        <!-- sign up option -->
        <p>Don't have an account? 
            <a href="#">Sign up</a></p>
    </form>

</body>
</html>
